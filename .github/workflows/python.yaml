name: DM API Tests

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
      TELEGRAM_BOT_ACCESS_TOKEN: ${{ secrets.TELEGRAM_BOT_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          export JAVA_HOME=$JAVA_HOME
          pytest . -v -s --alluredir=allure-results --disable-warnings
        continue-on-error: true

      - name: Run coverage
        if: ${{ always() }}
        run: |
          python -m telegram_notifier.bot

      - name: Archive allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    name: Generate report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Install java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install allure
        run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz && sudo tar -xvzf allure-2.35.1.tgz -C /opt/ && sudo ln -s /opt/allure-2.35.1/bin/allure /usr/bin/allure

      - name: Download allure results
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: allure-results

      - name: Generate allure report
        run: allure generate -c allure-results -o _site

      - name: Store report
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    name: Publish report
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Download allure results
        uses: actions/download-artifact@v5
        with:
          name: _site
          path: _site

      - name: Upload allure report
        uses: actions/upload-pages-artifact@v3

      - name: Deploy on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link to allure report
        run: echo "https://ponomarev-iv1986.github.io/dm_api_tests/"
